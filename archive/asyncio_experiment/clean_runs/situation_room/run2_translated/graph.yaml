vertices:
- id: v0
  role: classify_severity
  kind: llm
  role_prompt: 'Classify how serious a news article is: low, medium, high, or critical.'
  source_code: "async def classify_severity(message):\n    \"\"\"Classify how serious\
    \ a news article is: low, medium, high, or critical.\"\"\"\n    prompt = f\"\"\
    \"You are a news triage assistant. Rate the severity of the article below.\\n\\\
    nSeverity scale:\\n- low: routine or minor news with little wider impact\\n- medium:\
    \ notable regional news, no immediate widespread danger\\n- high: serious events\
    \ causing significant harm or large-scale disruption\\n- critical: mass casualties,\
    \ war escalation, major disasters, or events of urgent global significance\\n\\\
    nTitle: {message['title']}\\nSummary: {message['summary']}\\n\\nReturn JSON only,\
    \ no explanation, no nested JSON: {{\"severity\": \"low|medium|high|critical\"\
    , \"reason\": \"one short sentence\"}}\"\"\"\n    data = await _ask_json(prompt)\n\
    \    return {'severity': str(data.get('severity', 'unknown')).lower(), 'severity_reason':\
    \ data.get('reason', '')}"
- id: v1
  role: identify_location
  kind: llm
  role_prompt: Identify the single main geographic location an article is about.
  source_code: "async def identify_location(message):\n    \"\"\"Identify the single\
    \ main geographic location an article is about.\"\"\"\n    prompt = f\"\"\"Identify\
    \ the single main geographic location of the news article below.\\nIf no specific\
    \ place applies, use \"global\".\\n\\nTitle: {message['title']}\\nSummary: {message['summary']}\\\
    n\\nReturn JSON only, no explanation, no nested JSON: {{\"location\": \"city or\
    \ region\", \"country\": \"country or global\"}}\"\"\"\n    data = await _ask_json(prompt)\n\
    \    return {'location': data.get('location', 'unspecified'), 'country': data.get('country',\
    \ 'unspecified')}"
- id: v2
  role: write_briefing
  kind: llm
  role_prompt: Write a short, neutral 2-3 sentence intelligence briefing for an article.
  source_code: "async def write_briefing(message):\n    \"\"\"Write a short, neutral\
    \ 2-3 sentence intelligence briefing for an article.\"\"\"\n    prompt = f\"\"\
    \"Write a concise, neutral intelligence briefing (2-3 sentences) capturing the\
    \ key facts of the news article below. Plain English, no speculation.\\n\\nTitle:\
    \ {message['title']}\\nSummary: {message['summary']}\\n\\nReturn JSON only, no\
    \ explanation, no nested JSON: {{\"briefing\": \"your 2-3 sentence briefing\"\
    }}\"\"\"\n    data = await _ask_json(prompt)\n    return {'briefing': data.get('briefing',\
    \ '')}"
- id: v3
  role: severitytally
  kind: python_stateful
  role_prompt: Counts how many briefings fall into each severity bucket across a run.
  source_code: "class SeverityTally:\n    \"\"\"Counts how many briefings fall into\
    \ each severity bucket across a run.\"\"\"\n\n    def __init__(self):\n      \
    \  self.counts = {'low': 0, 'medium': 0, 'high': 0, 'critical': 0, 'unknown':\
    \ 0}\n\n    def process(self, message):\n        \"\"\"Record one enriched article's\
    \ severity, then pass the message through.\"\"\"\n        sev = message.get('severity',\
    \ 'unknown')\n        if sev not in self.counts:\n            sev = 'unknown'\n\
    \        self.counts[sev] += 1\n        return message"
  class_name: SeverityTally
- id: v4
  role: synchronizer
  kind: structural
  params:
    inports:
    - severity
    - location
    - briefing
  role_prompt: 'Wait for one message on each named inport; emit one merged output.
    Merge is by field-union: fields from each incoming message contribute to the output.'
  outports:
  - out
  - critical
